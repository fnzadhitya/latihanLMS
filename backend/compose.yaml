services:
  app:
    build: .
    ports:
      - "8000:5000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks: [lms_net]

  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [lms_net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [lms_net]

volumes:
  postgres_data:
  redis_data:

networks:
  lms_net:
